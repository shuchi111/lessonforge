[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lessonforge"
version = "0.1.0"
description = "Self-evaluating lesson content generator: generate -> evaluate -> regenerate, with memory."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "groq>=0.11",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "textstat>=0.7.3",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lessonforge = "lessonforge.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
